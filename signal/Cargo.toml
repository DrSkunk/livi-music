[package]
name = "livi-music-signal"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "WebRTC signaling relay for LIVI wireless music transfer"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3.34", features = ["sink"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = true
strip = true
